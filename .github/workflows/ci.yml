name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=bpc_connect --cov-report=term-missing
      - run: bpc-connect validate config/gateway.example.yaml
      - run: bpc-connect render config/gateway.example.yaml -o build/mihomo/config.yaml

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go test ./...
      - run: go vet ./...
      - name: Cross-build WGShim
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/bpc-wgshim
          rm -f bpc-wgshim
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/bpc-wgshim
          rm -f bpc-wgshim
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/bpc-wgshim
          rm -f bpc-wgshim.exe

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ShellCheck is available
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            exit 0
          fi

          echo "ShellCheck is not preinstalled; installing fallback package."
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version
      - name: Run ShellCheck
        run: |
          find deploy scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck
          shellcheck install.sh

  build:
    runs-on: ubuntu-latest
    needs: [python, go, shellcheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - run: pip install build
      - run: python -m build
      - name: Build deployment bundle
        run: |
          VERSION="$(python - <<'PY'
          import pathlib
          import tomllib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          PY
          )"
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh "${VERSION}" release-dist
          test -s release-dist/bpc-connect-deploy.tar.gz
          test -s release-dist/SHA256SUMS
          tar -tzf release-dist/bpc-connect-deploy.tar.gz | grep -q './VERSION'
          tar -tzf release-dist/bpc-connect-deploy.tar.gz | grep -q './install.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: bpc-connect-dist
          path: |
            dist/*
            release-dist/*
