name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=bpc_connect --cov-report=term-missing
      - run: bpc-connect validate config/gateway.example.yaml
      - run: bpc-connect render config/gateway.example.yaml -o build/mihomo/config.yaml

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Check Go formatting
        run: |
          files="$(gofmt -l cmd internal)"
          if [[ -n "$files" ]]; then
            printf 'Files requiring gofmt:\n%s\n' "$files"
            gofmt -d cmd internal
            exit 1
          fi
      - run: go test ./...
      - run: go vet ./...
      - name: Cross-build WGShim
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/bpc-wgshim
          rm -f bpc-wgshim
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/bpc-wgshim
          rm -f bpc-wgshim
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/bpc-agent-relay
          rm -f bpc-agent-relay
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/bpc-agent-relay
          rm -f bpc-agent-relay
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/bpc-controld
          rm -f bpc-controld
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/bpc-controld
          rm -f bpc-controld
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/bpc-routed-node
          rm -f bpc-routed-node
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/bpc-routed-node
          rm -f bpc-routed-node
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/bpc-wgshim
          rm -f bpc-wgshim.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/bpc-agent
          rm -f bpc-agent.exe

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ShellCheck is available
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            exit 0
          fi

          echo "ShellCheck is not preinstalled; installing fallback package."
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version
      - name: Run ShellCheck
        run: |
          find deploy scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck
          shellcheck install.sh

  build:
    runs-on: ubuntu-latest
    needs: [python, go, shellcheck, control-runtime, mesh-kernel-policy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - run: pip install build pytest
      - name: Exercise candidate updates in isolated temporary installations
        run: sudo "$(command -v python)" -m pytest tests/test_mesh_candidate.py -q
      - run: python -m build
      - name: Build deployment bundle
        run: |
          VERSION="$(python - <<'PY'
          import pathlib
          import tomllib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          PY
          )"
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            bash scripts/build-release.sh "${VERSION}" release-dist
          else
            bash scripts/build-mesh-candidate.sh release-dist
          fi
          test -s release-dist/bpc-connect-deploy.tar.gz
          test -s release-dist/SHA256SUMS
          tar -tzf release-dist/bpc-connect-deploy.tar.gz > /tmp/bpc-bundle-contents.txt
          grep -Fxq './VERSION' /tmp/bpc-bundle-contents.txt
          grep -Fxq './install.sh' /tmp/bpc-bundle-contents.txt
          grep -Fxq './bin/bpc-controld-linux-amd64' /tmp/bpc-bundle-contents.txt
          grep -Fxq './bin/bpc-controld-linux-arm64' /tmp/bpc-bundle-contents.txt
          grep -Fxq './bin/bpc-routed-node-linux-amd64' /tmp/bpc-bundle-contents.txt
          grep -Fxq './bin/bpc-routed-node-linux-arm64' /tmp/bpc-bundle-contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bpc-connect-dist
          path: |
            dist/*
            release-dist/*

  control-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - run: pip install -e '.[dev]'
      - run: go build -o /tmp/bpc-controld ./cmd/bpc-controld
      - name: Build pre-watermark Controller for rolling migration regression
        run: |
          git fetch origin 2d2a3513a901ef6a7d1ac5fac80c0292a6a9a775
          mkdir /tmp/bpc-legacy-source
          git archive 2d2a3513a901ef6a7d1ac5fac80c0292a6a9a775 | tar -x -C /tmp/bpc-legacy-source
          cd /tmp/bpc-legacy-source
          go build -o /tmp/bpc-controld-legacy ./cmd/bpc-controld
      - run: pytest tests/test_control_processes.py -s
        env:
          BPC_CONTROLD_BINARY: /tmp/bpc-controld
          BPC_LEGACY_CONTROLD_BINARY: /tmp/bpc-controld-legacy

  windows-agent-version:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bpc-connect-dist
          path: artifacts
      - name: Verify the packaged Windows executable reports the bundle version
        shell: pwsh
        run: |
          $bundle = "artifacts/release-dist/bpc-connect-deploy.tar.gz"
          New-Item -ItemType Directory -Path unpacked | Out-Null
          tar -xzf $bundle -C unpacked
          if ($LASTEXITCODE -ne 0) { throw "Bundle extraction failed" }
          $expected = (Get-Content unpacked/VERSION -Raw).Trim()
          $actual = (& ./unpacked/bin/bpc-agent-windows-amd64.exe version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne "bpc-agent $expected") {
            throw "Windows Agent version mismatch: expected $expected, got $actual"
          }

  mesh-kernel-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Build isolated kernel routing test
        run: go test -c -o /tmp/bpc-routed-kernel-tests ./cmd/bpc-routed-node
      - name: Verify marked mesh routing and legacy coexistence in a real namespace
        run: sudo env BPC_TEST_NETNS=1 /tmp/bpc-routed-kernel-tests -test.run '^Test(PublicPolicyRealNamespace|TunWriterRealNamespace)$' -test.v
