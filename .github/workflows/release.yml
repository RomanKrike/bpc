name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bpc-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          PY
          )"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be a stable semver, got: ${VERSION}" >&2
            exit 2
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build Python package
        if: steps.version.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Prepare release notes
        if: steps.version.outputs.exists != 'true'
        shell: bash
        run: |
          python - '${{ steps.version.outputs.version }}' "${RUNNER_TEMP}/bpc-release-notes.md" <<'PY'
          import pathlib
          import sys

          version, output = sys.argv[1:]
          changelog = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          marker = f'## {version}\n'
          if marker not in changelog:
              raise SystemExit(f'Missing changelog for release {version}')
          notes = changelog.split(marker, 1)[1].split('\n## ', 1)[0].strip()
          pathlib.Path(output).write_text(f'# BPC v{version}\n\n{notes}\n', encoding='utf-8')
          PY

      - name: Build deployment bundle
        if: steps.version.outputs.exists != 'true'
        run: |
          bash scripts/build-unified-release.sh "${{ steps.version.outputs.version }}" release-dist
          cp dist/* release-dist/
          (cd release-dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS)

      - name: Publish GitHub Release
        if: steps.version.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: BPC v${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/bpc-release-notes.md
          generate_release_notes: true
          make_latest: true
          files: release-dist/*
