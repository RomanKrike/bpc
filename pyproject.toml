[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bpc-connect"
version = "0.2.1"
description = "Fail-closed multi-transport bridge for BPC connectivity"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "RomanKrike"}]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
bpc-connect = "bpc_connect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bpc_connect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
